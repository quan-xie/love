<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Love with Mrs Hongdan </title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html {
  -webkit-text-size-adjust: 100%;
  height: 100%;
}
body {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background: linear-gradient(160deg, #2b0a12 0%, #4a1020 48%, #1a0a12 100%);
  font-family: "Georgia", "STSong", "SimSun", "KaiTi", "STKaiti", serif;
  color: #f6e7ec;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#garden {
  position: fixed;
  inset: 0;
  z-index: 0;
}
#main {
  position: relative;
  z-index: 1;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  text-align: center;
}
#code {
  font-size: 18px;
  line-height: 2;
  letter-spacing: 2px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  max-width: 680px;
  min-height: 6em;
  user-select: none;
}
#code .keyword {
  color: #ff7b9c;
  font-weight: bold;
  text-shadow: 0 0 12px rgba(255,123,156,0.85);
}
#clockBox { margin-top: 30px; }
#messages {
  color: #ffb3c6;
  font-size: 15px;
  letter-spacing: 1px;
  margin-bottom: 10px;
}
#elapseClock {
  font-size: 24px;
  font-weight: bold;
  color: #ff7b9c;
  letter-spacing: 1px;
  text-shadow: 0 0 14px rgba(255,123,156,0.7);
  font-family: "SFMono-Regular", Consolas, Menlo, monospace;
  word-break: keep-all;
}

/* 爱心描边（文字外围） */
#heartOutline {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 620px;
  height: 580px;
  z-index: 0;
  pointer-events: none;
  filter: drop-shadow(0 0 12px rgba(255,123,156,0.55));
  animation: heartPulse 3.2s ease-in-out infinite;
}
#heartOutline path {
  fill: rgba(255,123,156,0.04);
  stroke: #ff7b9c;
  stroke-width: 2;
  stroke-linejoin: round;
}
#code, #clockBox { position: relative; z-index: 1; }
@keyframes heartPulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}
footer {
  position: fixed;
  bottom: max(14px, env(safe-area-inset-bottom));
  left: 0;
  right: 0;
  z-index: 1;
  text-align: center;
  font-size: 12px;
  color: rgba(246,231,236,0.45);
  padding: 0 12px;
}
footer a { color: rgba(246,231,236,0.6); }

/* 手机端适配 */
@media (max-width: 640px) {
  #code { font-size: 16px; line-height: 1.9; letter-spacing: 1px; }
  #elapseClock { font-size: 19px; }
  #messages { font-size: 13px; }
  #clockBox { margin-top: 22px; }
  #heartOutline { width: 340px; height: 320px; }
}
@media (max-width: 380px) {
  #code { font-size: 14px; }
  #elapseClock { font-size: 16px; }
  #heartOutline { width: 280px; height: 265px; }
}
</style>
</head>
<body>

<canvas id="garden"></canvas>

<div id="main">
  <svg id="heartOutline" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <path vector-effect="non-scaling-stroke"
          d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </svg>
  <div id="code"></div>
  <div id="clockBox">
    <div id="messages">相遇，相识，相恋...</div>
    <div id="elapseClock"></div>
  </div>
</div>

<footer>Made for 洪丹女士 · 2026.11.01</footer>

<script>
(function () {
  // ============================================================
  // 1. 文案（类型机效果，关键词用 § 包裹）
  // ============================================================
  var plainText =
    "我很努力的\n要成为一个\n§优秀的男朋友§\n\n" +
    "你也很努力的\n在成为一个\n§优秀的女朋友的路上§\n\n" +
    "这种感觉\n真的是\n§太好了§\n\n" +
    "唯有梦想与好姑娘\n§不可辜负§\n\n" +
    "------------\n\n" +
    "§I want to say:§\n" +
    "§洪丹女士§\n" +
    "§I love you!§\n" +
    "-- 谢权";

  function renderHtml(text) {
    var html = "";
    var kw = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (ch === "§") { kw = !kw; continue; }
      if (ch === "\n") { html += "<br/>"; continue; }
      html += kw ? '<span class="keyword">' + ch + '</span>' : ch;
    }
    return html;
  }

  var codeEl = document.getElementById("code");
  var idx = 0;
  function type() {
    if (idx <= plainText.length) {
      var typed = plainText.slice(0, idx);
      var open = (typed.match(/§/g) || []).length % 2 === 1;
      if (open) typed = typed.slice(0, typed.lastIndexOf("§"));
      codeEl.innerHTML = renderHtml(typed);
      idx++;
      setTimeout(type, 90);
    }
  }

  // ============================================================
  // 2. 时间计数器（起点 2026/11/1）
  // ============================================================
  var together = new Date(2026, 10, 1, 0, 0, 0, 0); // 月份从 0 起，10 = 11 月
  function timeElapse() {
    var now = new Date();
    var diff = now - together;
    if (diff < 0) diff = 0;
    var days = Math.floor(diff / 86400000);
    var hours = Math.floor(diff / 3600000) % 24;
    var minutes = Math.floor(diff / 60000) % 60;
    var seconds = Math.floor(diff / 1000) % 60;
    document.getElementById("elapseClock").innerHTML =
      days + " 天 " + hours + " 小时 " + minutes + " 分 " + seconds + " 秒";
  }

  // ============================================================
  // 3. 漂浮爱心动画（手机端减少数量，保证流畅）
  // ============================================================
  var canvas = document.getElementById("garden");
  var ctx = canvas.getContext("2d");
  var hearts = [];
  var COLORS = ["#ff7b9c", "#ff9fb6", "#ff5c7a", "#ffb3c6", "#ff8fab"];
  var isMobile = window.innerWidth < 640;
  var HEART_COUNT = isMobile ? 18 : 36;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  function drawHeart(x, y, size, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    var s = size;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(-s / 4, -s / 4, s / 4, 0, Math.PI * 2);
    ctx.arc(s / 4, -s / 4, s / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s / 2, -s / 10);
    ctx.lineTo(s / 2, -s / 10);
    ctx.lineTo(0, s / 2 + s / 8);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function makeHeart() {
    return {
      x: Math.random() * canvas.width,
      y: canvas.height + 20,
      size: 10 + Math.random() * 18,
      speed: 0.4 + Math.random() * 0.9,
      sway: 0.4 + Math.random() * 1.2,
      swayPhase: Math.random() * Math.PI * 2,
      alpha: 0.35 + Math.random() * 0.55,
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    };
  }
  for (var i = 0; i < HEART_COUNT; i++) {
    var h = makeHeart();
    h.y = Math.random() * canvas.height;
    hearts.push(h);
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var j = 0; j < hearts.length; j++) {
      var p = hearts[j];
      p.y -= p.speed;
      p.swayPhase += 0.02;
      var x = p.x + Math.sin(p.swayPhase) * p.sway;
      drawHeart(x, p.y, p.size, p.color, p.alpha);
      if (p.y < -30) {
        hearts[j] = makeHeart();
        hearts[j].y = canvas.height + 20;
      }
    }
    requestAnimationFrame(animate);
  }

  // ============================================================
  // 启动
  // ============================================================
  type();
  timeElapse();
  setInterval(timeElapse, 500);
  animate();
})();
</script>

</body>
</html>
